<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Product list with cart</title>

  <!-- css link -->
  <link rel="stylesheet" href="style.css">

  
  <!-- Google font link -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">


</head>
<body>
  <main>
    <div class="container">
      <div class="products-section">
        <h1 class="product-heading heading-primary">Desserts</h1>
        <div id="products-gallery"></div>
      </div>
      <div class="cart-section">
        <h2 class="cart-h2">Your Cart <span id="cart-number">(0)</span></h2>
        <div class="cart-cont">
          <div class="cart-image">
            <img src="./assets/images/illustration-empty-cart.svg" alt="empty-cart">
            <p class="p-cart">Your added items will appear here</p>
          </div>
        </div>
      </div>
      <div class="order-confirmed hidden">
        <div class="order-cont">
          <img src="./assets/images/icon-order-confirmed.svg" alt="mark in a circle">
          <h2 class="order-h2">Order Confirmed</h2>
          <p class="order-text">We hope you enjoy your food!</p>
          <div class="order-items"></div>
          <button class="reset-order">Start New Order</button>
        </div>
      </div>
      <div class="overlay"></div>
    </div>
  </main>
  <script src="index.js"></script>
</body>
</html>
